name: Validate Python source and docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate syntax without hardware
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          ast.parse(Path('music_rgb.py').read_text(encoding='utf-8'))
          print('Python syntax: OK')
          PY
      - name: Check required documentation files
        run: |
          test -s README.md
          test -s docs/INSTALL.md
          test -s docs/HARDWARE.md
          test -s docs/ARCHITECTURE.md
          test -s docs/TROUBLESHOOTING.md
          test -s docs/BENCHMARKS.md
          test -s docs/SECURITY.md
          test -s docs/GUIA_ES.md
          echo 'Documentation: OK'

      - name: Validate all Python source files
        run: |
          python -m compileall -q music_rgb.py audio_devices.py preflight.py instance_lock.py writer_handshake.py writer_restore.py tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
